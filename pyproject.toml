[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "signalbench"
version = "0.1.0"
description = "Leakage-aware financial sentiment benchmarks and event-driven return research"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "duckdb==1.3.2",
  "scikit-learn==1.6.1", "scipy==1.15.3", "statsmodels==0.14.4",
  "matplotlib==3.10.3", "httpx==0.28.1", "python-dotenv==1.1.0",
  "pydantic==2.11.5", "PyYAML==6.0.2", "beautifulsoup4==4.13.4",
  "pandas-market-calendars==5.1.0", "tqdm==4.67.1", "tabulate==0.9.0", "datasketch==1.6.5",
  "huggingface-hub==0.33.4", "tiktoken==0.9.0", "yfinance==0.2.65"
]
[project.optional-dependencies]
ml = ["torch==2.7.1", "transformers==4.53.2", "peft==0.16.0", "trl==0.19.1", "accelerate==1.8.1", "datasets==3.6.0", "sentence-transformers==4.1.0"]
train = ["bitsandbytes==0.46.1; sys_platform == 'linux'"]
tracking = ["trackio==0.2.2", "gradio==5.35.0"]
dev = ["nbformat==5.10.4", "pytest==8.4.1", "ruff==0.12.4", "pre-commit==4.2.0"]
[project.scripts]
signalbench = "signalbench.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
